services:
  db:
    image: postgres:15-alpine
    container_name: todo-db
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${DB_USER:?DB_USER is required}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      POSTGRES_DB: ${DB_NAME:?DB_NAME is required}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    networks:
      - backend_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod

    container_name: todo-backend
    restart: unless-stopped

    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      PORT: 8080
      GIN_MODE: release

    expose:
      - "8080"

    depends_on:
      db:
        condition: service_healthy

    networks:
      - frontend_network
      - backend_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        REACT_APP_API_URL: /api

    container_name: todo-frontend
    restart: unless-stopped

    ports:
      - "80:80"

    depends_on:
      - backend

    networks:
      - frontend_network

volumes:
  postgres_data:

networks:
  frontend_network:
    driver: bridge

  backend_network:
    driver: bridge
